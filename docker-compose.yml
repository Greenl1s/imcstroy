# Четыре контейнера на одной машине.
#
#   caddy       — единственный, кто смотрит наружу. Отдаёт статику и проксирует /api.
#                 Сам получает и продлевает сертификат Let's Encrypt.
#   api         — Node. Доступен только изнутри docker-сети. Обслуживает "Учёт приборов".
#   filemanager — Node. Свой файловый менеджер (замена FileBrowser Quantum).
#   db          — PostgreSQL. Порт наружу НЕ проброшен: до базы нельзя достучаться
#                 из интернета в принципе, только через API.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TOKEN_TTL: 12h
      PORT: 3000
      FILE_LINK_SECRET: ${FILE_LINK_SECRET}
      FILEMANAGER_INTERNAL_URL: http://filemanager:3000
    expose:
      - "3000"

  # Собственный файловый менеджер — вместо FileBrowser Quantum.
  # Своя авторизация, просмотр/загрузка/удаление файлов, открытие
  # Word/Excel/PowerPoint через OnlyOffice, PDF — прямо в браузере.
  filemanager:
    build: ./filemanager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Реальные файлы — обычная папка на диске, можно копировать через scp
      - ./filemanager-data:/data
    environment:
      DATA_ROOT: /data
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      ONLYOFFICE_PUBLIC_URL: https://office.${SITE_ADDRESS}
      FILEMANAGER_INTERNAL_URL: http://filemanager:3000
      FILE_LINK_SECRET: ${FILE_LINK_SECRET}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      OMNIROUTE_URL: http://omniroute:20129
    expose:
      - "3000"

  # ИИ-шлюз OmniRoute — используется для распознавания вложенных при
  # создании проекта файлов (номер дела, суд, судья и т.д.). Доступен
  # ТОЛЬКО изнутри docker-сети (из filemanager) — как и db, наружу не
  # смотрит: у собственной панели OmniRoute нет пароля по умолчанию.
  omniroute-redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    volumes:
      - omniroute-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    depends_on:
      omniroute-redis:
        condition: service_healthy
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      DASHBOARD_PORT: 20128
      API_PORT: 20129
      API_HOST: 0.0.0.0
      REDIS_URL: redis://omniroute-redis:6379
    volumes:
      - omniroute-data:/app/data
    expose:
      - "20128"
      - "20129"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - filemanager
      - onlyoffice
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-init/apply-limits.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-db:/var/lib/postgresql
      - ./onlyoffice/apply-limits.sh:/docker-init/apply-limits.sh:ro
    expose:
      - "80"

volumes:
  db-data:
  caddy-data:
  caddy-config:
  onlyoffice-data:
  onlyoffice-log:
  onlyoffice-lib:
  onlyoffice-db:
  omniroute-data:
  omniroute-redis-data:
