name: uchet-tabelya
services:
  timesheets:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${TIMESHEET_PORT:-3180}:3180"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3180}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - timesheet-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3180'+(process.env.APP_BASE_PATH||'').replace(/[/]$/,'')+'/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    tmpfs:
      - /tmp
volumes:
  timesheet-data:
