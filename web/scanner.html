<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12618e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Сканер приборов"><link rel="manifest" href="scanner.webmanifest"><link rel="apple-touch-icon" href="scanner-apple-touch-icon.png">
<title>Найти прибор по фото</title><link rel="stylesheet" href="scanner.css"></head><body>
<main class="scanner"><header><a href="./">← К приборам</a><b>Поиск по фото</b></header>
<section class="hero"><h1>Сфотографируйте прибор</h1><p>Поместите прибор или его заметную часть в центр кадра. Хороший свет и простой фон повысят точность.</p>
<label class="camera"><span>Открыть камеру</span><input id="photoInput" type="file" accept="image/*" capture="environment"></label>
<img id="preview" hidden alt="Снятая фотография"><div id="status" class="status">Для первого теста сначала добавьте эталонные фотографии из карточек приборов.</div></section>
<section id="results" class="results"></section></main><script type="module" src="js/scanner.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./scanner-sw.js');</script></body></html>
