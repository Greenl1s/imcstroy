<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учет оборудования</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script>
    // Адрес API. Раньше это был отдельный сайт (imcstroy.ru), теперь этот
    // же сервис живёт на files.<домен>/instruments — Caddy сам срезает
    // "/instruments" перед тем, как передать запрос бэкенду, поэтому сам
    // бэкенд ничего менять не пришлось, только этот адрес во фронтенде.
    window.API_BASE = '/instruments/api';
    // Адрес файлового менеджера (ИСУ). Пусто — значит тот же домен:
    // на боевом сервере оба сервиса живут на files.<домен>, и файлы,
    // выбранные с компьютера, уходят прямо в него по /api/upload.
    // Задаётся отдельно только на стенде, где сервисы на разных портах.
    window.FILEMANAGER_BASE = window.FILEMANAGER_BASE || '';
  </script>
</head>
<body>
  <main class="shell">
    <!-- Авторизация -->
    <section id="authView" class="auth-view">
      <form id="loginForm" class="panel auth-panel">
        <h1>Учет оборудования</h1>
        <p>Войдите в систему</p>
        <label>Логин<input id="loginUsername" autocomplete="username" required></label>
        <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Войти</button>
      </form>
    </section>

    <!-- Основное приложение -->
    <section id="appView" class="hidden">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Учёт оборудования</h1>
          <button id="backToIsuButton" class="primary" type="button">← В ИСУ</button>
        </div>
        <div class="topbar-actions">
          <span id="currentUserBadge" class="user-name"></span>
          <div class="menu-wrapper">
            <button id="menuButton" class="secondary icon-btn" type="button" aria-label="Меню">☰</button>
            <div id="menuDropdown" class="menu-dropdown hidden">
              <button id="themeToggle" type="button">Тёмная</button>
              <button id="profileButton" type="button">Профиль</button>
              <div class="menu-divider admin-only"></div>
              <button id="usersButton" class="admin-only" type="button">Пользователи</button>
              <button id="controlTypesButton" class="admin-only" type="button">Классификации</button>
              <button id="companiesButton" class="admin-only" type="button">Компании</button>
              <div class="menu-divider"></div>
              <button id="exportAllButton" type="button">Скачать таблицу приборов</button>
              <button id="exportExpiringButton" type="button">Окончание поверок</button>
              <button id="exportQrButton" type="button">Выгрузить все QR-коды</button>
            </div>
          </div>
          <button id="logoutButton" class="danger" type="button">Выйти</button>
        </div>
      </header>

      <!-- Список -->
      <section id="listScreen">
        <!-- Сводка. Каждое число — это фильтр: щелчок оставляет в списке
             только те приборы, о которых оно говорит. -->
        <div class="summary" id="summaryBar"></div>

        <div class="toolbar panel">
          <input id="searchInput" class="search-full" placeholder="Поиск по названию, серийному номеру, модели или инв. номеру">

          <div class="toolbar-bottom">
            <div class="toolbar-buttons">
              <button id="addInstrumentButton" class="primary admin-only" type="button">Добавить</button>
              <button id="retiredButton" class="secondary admin-only" type="button">Списанные</button>
              <button id="kitsButton" class="secondary" type="button">Комплекты</button>
              <button id="massToggleBtn" class="secondary" type="button">Выбрать</button>
              <button id="pendingTransfersBtn" class="danger" type="button" style="display:none;">Передачи (<span id="pendingTransfersCount">0</span>)</button>
            </div>

            <!-- Фильтры стоят ровно над своими колонками в строках списка:
                 ширина фильтра и ширина колонки заданы одной переменной,
                 а справа зарезервировано место под кнопку действия. -->
            <div class="filters-row">
              <div class="filter-chip">
                <span class="filter-chip-label" data-sort="status">Состояние</span>
                <select id="conditionFilter">
                  <option value="all">Все</option>
                  <option value="free">Свободен</option>
                  <option value="busy">Занят</option>
                  <option value="booked">Забронирован</option>
                </select>
              </div>

              <div class="filter-chip">
                <span class="filter-chip-label" data-sort="control_type">Классификация</span>
                <select id="controlTypeFilter">
                  <option value="all">Все</option>
                  <option value="none">Не указано</option>
                </select>
              </div>

              <div class="filter-chip">
                <span class="filter-chip-label" data-sort="valid_until">Поверка</span>
                <select id="verificationFilter">
                  <option value="all">Все</option>
                  <option value="valid">Действует</option>
                  <option value="soon">Истекает ≤ 30 дней</option>
                  <option value="expired">Просрочена</option>
                  <option value="none">Не требуется</option>
                  <option value="unset">Срок не заполнен</option>
                </select>
              </div>

              <div class="filter-chip">
                <span class="filter-chip-label" data-sort="company">Владелец</span>
                <select id="companyFilter">
                  <option value="all">Все</option>
                  <option value="none">Не привязан</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div id="instrumentList" class="list"></div>

        <!-- Панель массовых действий: показывается, только когда включён
             режим «Выбрать». Все операции на виду, опасные — отдельно
             справа, и всегда написано, сколько приборов выбрано. -->
        <div id="massPanel" class="mass-panel hidden">
          <span class="mass-count" id="massCount">Ничего не выбрано</span>
          <button id="massIssueBtn" type="button">Взять</button>
          <button id="massBookBtn" type="button">Забронировать</button>
          <button id="massConfirmBookingBtn" type="button">Подтвердить бронь</button>
          <button id="massReturnBtn" type="button">Вернуть</button>
          <button id="massCancelBookingBtn" type="button">Отменить бронь</button>
          <button id="massTransferBtn" type="button">Передать</button>
          <button id="massQrWordBtn" type="button">QR-коды в Word</button>
          <button id="massSetCompanyBtn" type="button">Назначить владельца</button>
          <button id="massMakeKitBtn" type="button">Собрать комплект</button>
          <span class="mass-spacer"></span>
          <button id="massRetireBtn" class="admin-only mass-danger" type="button">Списать</button>
          <button id="massDeleteBtn" class="admin-only mass-danger" type="button">Удалить</button>
          <button id="massCancelBtn" class="mass-cancel" type="button">Отменить выбор</button>
        </div>
      </section>

      <!-- Карточка прибора -->
      <section id="cardScreen" class="hidden"></section>

      <!-- Комплекты: и список, и карточка одного комплекта
           (она же — экран проверки перед выездом). -->
      <section id="kitsScreen" class="hidden"></section>
    </section>
  </main>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
