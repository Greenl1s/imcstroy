<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нет связи — ИМС</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #232a28; color: #e8efea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .card { max-width: 420px; text-align: center; display: grid; gap: 14px; }
    img { width: 72px; height: 72px; margin: 0 auto; border-radius: 16px; }
    h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
    p { color: #a9bdb2; font-size: 15px; }
    button {
      min-height: 44px; padding: 10px 22px; border: 0; border-radius: 8px;
      background: #7fc0a1; color: #10201a; font: inherit; font-weight: 600;
      cursor: pointer; justify-self: center;
    }
    button:active { transform: scale(0.98); }
    .hint { font-size: 13px; color: #7e9389; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/app/icon-192.png" alt="">
    <h1>Связи с сервером нет</h1>
    <!-- Честно говорим, что доступно, а что нет: «попробуйте позже» без
         объяснений заставляет человека гадать, сломалось ли приложение. -->
    <p>То, что вы открывали раньше, доступно и сейчас — приложение помнит последнюю
       загруженную версию. А эта страница у него ещё не сохранена.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
    <!-- Обещать очередь снимков рано: она будет отдельным шагом. Пока
         честно говорим, что без сети можно только смотреть. -->
    <p class="hint">Без связи приложение показывает сохранённое, но
       менять данные нельзя — это делает сервер.</p>
  </div>
  <script>
    // Как только сеть вернулась — перезагружаемся сами, без нажатий.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
